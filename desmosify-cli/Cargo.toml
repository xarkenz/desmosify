[package]
name = "desmosify-cli"
version = "0.1.0"
edition = "2024"
authors = ["xarkenz"]

[lib]
name = "desmosify_cli"
path = "src/lib.rs"

[[bin]]
name = "driver"
path = "src/main.rs"

[dependencies]
desmosify = { path = "../desmosify-core", features = ["clap", "fs"] }
clap = { version = "4.6", features = ["derive"] }
